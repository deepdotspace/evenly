name = "evenly"
# Honored since SDK 0.15.0 (it was silently discarded before, so the deployed
# worker has effectively been running on a modern runtime already). Pinned to the
# release date of the workerd this repo installs (1.20260625.1) so local dev, the
# test runtime and the deploy agree.
compatibility_date = "2026-06-25"
# assets_navigation_has_no_effect is required by the SDK (REQUIRED_COMPATIBILITY_FLAGS
# in deepspace/worker) and is what makes not_found_handling = "none" below actually
# hand navigation requests to the worker instead of the asset layer.
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/ws/*", "/internal/*", "/v1/*", "/_deepspace/*"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppRecordRoom", "AppYjsRoom", "AppCanvasRoom", "AppPresenceRoom", "AppCronRoom", "AppJobRoom"]

[durable_objects]
bindings = [
  { name = "RECORD_ROOMS", class_name = "AppRecordRoom" },
  { name = "YJS_ROOMS", class_name = "AppYjsRoom" },
  { name = "CANVAS_ROOMS", class_name = "AppCanvasRoom" },
  { name = "PRESENCE_ROOMS", class_name = "AppPresenceRoom" },
  { name = "CRON_ROOMS", class_name = "AppCronRoom" },
  { name = "JOB_ROOMS", class_name = "AppJobRoom" },
]

# For per-app resources (D1, KV, Vectorize, R2, Queues), set the id field to
# "auto" — DeepSpace provisions and tears down with the deploy. Example:
#
# [[d1_databases]]
# binding = "MY_DB"
# database_name = "my-app-db"
# database_id = "auto"
#
# Full reference (all binding types + companion fields):
#   docs/proposals/binding-auto-provisioning.md

[vars]
APP_NAME = "evenly"
DEEPSPACE_APP_ID = "app_01KZ4FK2D15DK4TWA8TAWWNTAG"

[dev]
port = 8780
inspector_port = 9237

# Secrets (set via `wrangler secret put` or written by `deepspace dev`):
#   AUTH_JWT_PUBLIC_KEY
#   AUTH_JWT_ISSUER
#   AUTH_WORKER_URL
#   OWNER_USER_ID
